name: publish

# 打 tag（v0.3.0 之类）即发布到 npm；也可在 Actions 页手动触发。
#
# 用 npm Trusted Publishing（OIDC）发布，仓库里不存任何长期 token：
# npm 侧把本仓库配成 trusted publisher 后，Actions 用短期 OIDC 凭据直接发布。
# 好处：绕开账号 2FA，也没有可能泄漏的 NPM_TOKEN Secret。
#
# 首次需在 npm 网页配置一次（见 README「发布」一节）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Trusted Publishing 必需：npm 用它验证发布确实来自这个仓库的这个 workflow。
  id-token: write

jobs:
  verify:
    name: 校验与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 语法先过一遍：两个半件都是纯 ESM / 手写 CJS 包，改动后最容易犯的就是语法错。
      - name: 语法检查
        run: |
          node --check index.mjs
          node --check client.js

      - name: 单元测试
        run: node --test test/engine.test.mjs

      # 打包一次，确认 files 白名单里的东西真的都在包里。
      - name: 检查 npm 包内容
        run: |
          npm pack --dry-run

  publish:
    name: 发布到 npm
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # OIDC 可信发布需要较新的 npm。
      - name: 升级 npm（OIDC 支持）
        run: npm install -g npm@latest

      # 标签必须和 package.json 的版本一致，否则发出去的版本会跟 tag 对不上。
      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $TAG 与 package.json 版本 $PKG 不一致"
            exit 1
          fi

      # 不传 NODE_AUTH_TOKEN：npm 会自动走 OIDC 换短期凭据。
      - name: 发布（Trusted Publishing）
        run: npm publish --provenance --access public
